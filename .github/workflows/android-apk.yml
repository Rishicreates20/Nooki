name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's ubuntu runners ship the Android SDK (ANDROID_HOME) with licenses accepted;
      # AGP downloads the exact platform it needs.

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug + release APKs
        # No keystore secrets in CI, so the release APK is debug-signed (see app/build.gradle.kts).
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Privacy check, no internet permission
        run: bash tools/ci/check_no_internet.sh app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nooki-apk-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  screens:
    # Renders every screen to PNG. A problem here never blocks the APK above.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Render screens
        run: ./gradlew :app:testDebugUnitTest -Pscreenshots --tests "com.example.ScreenshotTest"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: app/build/nooki-shots
          if-no-files-found: warn
          retention-days: 14
